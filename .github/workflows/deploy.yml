name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".clasp.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: clasp-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "CLASPRC_JSON secret is not configured; skipping deploy."
            exit 0
          fi
          if [ -z "$SCRIPT_ID" ]; then
            echo "SCRIPT_ID secret is not configured; skipping deploy."
            exit 0
          fi
          mkdir -p "$HOME/.clasprc"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          python3 - <<'PY'
          import json, os
          path = ".clasp.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["scriptId"] = os.environ["SCRIPT_ID"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      - name: Push Apps Script sources
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "Deploy secrets missing; push skipped."
            exit 0
          fi
          clasp push -f

      - name: Update deployment
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "Deploy secrets missing; deployment update skipped."
            exit 0
          fi
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "DEPLOYMENT_ID not set; creating a version-only deploy description."
            clasp deploy --description "66-deck-agent ${GITHUB_SHA}"
          else
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "66-deck-agent ${GITHUB_SHA}"
          fi
