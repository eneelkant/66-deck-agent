name: Pull Apps Script

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Pull live Apps Script sources
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ] || [ -z "${SCRIPT_ID:-}" ]; then
            echo "CLASPRC_JSON or SCRIPT_ID secret is not configured."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          python3 - <<'PY'
          import json, os
          path = ".clasp.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["scriptId"] = os.environ["SCRIPT_ID"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          clasp pull --force
          python3 - <<'PY'
          import json
          path = ".clasp.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["scriptId"] = "REPLACE_WITH_APPS_SCRIPT_ID"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          find src -type f | sort
          (cd src && wc -l *)

      - name: Upload pulled sources
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-pull
          path: src
          if-no-files-found: error
